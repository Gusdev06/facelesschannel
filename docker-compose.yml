version: '3.8'

services:
  # Redis service for BullMQ job queue
  redis:
    image: redis:7-alpine
    container_name: faceless-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceless-video-generator
    ports:
      - "3000:3000"
    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000

      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # API Keys (set these in .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      # Mount output directory for generated videos
      - ./output:/app/output
      # Optional: mount uploads if needed
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local
